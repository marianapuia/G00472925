<ion-header>
  <ion-toolbar>
    <ion-title>{{ person?.name }}</ion-title>
    <ion-buttons slot="end">
      <ion-button [routerLink]="'/movie-details'">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button [routerLink]="'/home'">
        <ion-icon name="home" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button [routerLink]="'/favourites'">
        <ion-icon name="heart" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" *ngIf="person">
  <img *ngIf="person.profile_path" [src]="imgBase + person.profile_path" width="200" />
  <div *ngIf="!person.profile_path">No image</div>

  <p *ngIf="person.also_known_as && person.also_known_as.length > 0">{{ person.also_known_as[0] }}</p>
<p *ngIf="person.birthday">{{ person.birthday | date:'dd-MMM-yyyy' }}<span *ngIf="person.deathday"> - {{ person.deathday | date:'dd-MMM-yyyy' }}</span></p>
  <p *ngIf="person.place_of_birth">{{ person.place_of_birth }}</p>
  <p>{{ person.biography }}</p>

  <h2>Other Movies</h2>
  <ion-item *ngFor="let m of credits" button="true" (click)="onMovieClick(m)">
    <ion-label>{{ m.title }}</ion-label>
    <img *ngIf="m.poster_path" [src]="imgBase + m.poster_path" slot="end" width="50" />
  </ion-item>
</ion-content>
